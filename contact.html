<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website - Contact</title>
 <style>
    /* Basic Styling shared across pages */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      color: #333;
    }
    header {
      background-color: #f4f4f9;
      color: #333;
      padding: 1rem 0;
      text-align: center;
    }
    nav {
      background-color: #292929;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px 0;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 4px;
    }
    nav a:hover, nav a.active {
      background-color: #bc7e1a;
    }
    main {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 0px;
    }
    footer {
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      background-color: #2c3e50;
      color: white;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Get in Touch</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

  <main>
    <h2>Contact Me</h2>
    <form>
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Your name">
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Your email">
      </div>
      <div class="form-group">
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" placeholder="Your message"></textarea>
      </div>
      <button type="button" onclick="alert('Message sent!')">Send Message</button>
    </form>
    <p>Or, if it's easier for you to email me, you can do so at ejsimonds@gmail.com</p>
  </main>

  <footer>
    <p>&copy; Ted Simonds, 2026. Email: ejsimonds@gmail.com or edward.simonds@london.ac.uk</p>
  </footer>

</body>
</html>
